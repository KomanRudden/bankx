quarkus:
  log:
    level: INFO
    category:
      io.quarkus.keycloak:
        level: DEBUG

  datasource:
    db-kind: postgresql
    username: bankx
    password: bankx
    jdbc:
      url: jdbc:postgresql://localhost:5432/bankx
      max-size: 8

  smallrye-openapi:
    path: /openapi

  swagger-ui:
    path: /swagger-ui

  http:
    port: 8081
    auth:
      permission:
        authenticated:
          paths: /api/v1/accounts/*
          policy: authenticated

  oidc:
    auth-server-url: http://localhost:8080/realms/bankx
    client-id: bankx
    credentials:
      secret: tAsuD3jDrfOsy1g8dGJTIlBsBVxsdEUu # never commit an unencrypted secret
    tls:
      verification: none

  keycloak:
    policy-enforcer:
      enable: true
    devservices:
      enabled: false

# Adding a prod. profile prefix to quarkus.oidc.auth-server-url ensures that Dev Services for Keycloak
# launches a container for you when the application is run in dev mode
prod:
  quarkus:
    oidc:
      auth-server-url: https://localhost:8543/realms/bankx